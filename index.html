<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 單位：公尺（1:1）。樓高 4.2m；塔身 8 節 × 40m；屋頂約 449m；含塔尖 508m。
const _Y = new THREE.Vector3(0, 1, 0), _d = new THREE.Vector3(), _c = new THREE.CylinderGeometry(1, 1, 1, 8), V = (x, y, z) => new THREE.Vector3(x, y, z);
function seg(m, a, b) { _d.subVectors(b, a); const l = _d.length(); m.position.copy(a).addScaledVector(_d, 0.5); m.quaternion.setFromUnitVectors(_Y, _d.normalize()); m.scale.set(m.userData.r, l, m.userData.r); }
function strut(a, b, r, mat) { const m = new THREE.Mesh(_c, mat); m.userData.r = r; seg(m, a, b); m.castShadow = true; return m; }
const FLOOR = 4.2, BAY = 3;

// 八邊形（切角正方形）平面，h = 半寬，c = 切角
const poly = (h, c) => [[-h+c,-h],[h-c,-h],[h,-h+c],[h,h-c],[h-c,h],[-h+c,h],[-h,h-c],[-h,-h+c]];

// 兩個平面之間放樣成側牆；uv 以「窗格/樓層」為單位，方便貼圖重複
function loft(pb, pt, y0, y1, mat, cap = true) {
  const pos = [], uv = [], n = pb.length;
  let u = 0;
  const v1 = (y1 - y0) / FLOOR;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a = pb[i], b = pb[j], c = pt[j], e = pt[i];
    const du = Math.hypot(b[0]-a[0], b[1]-a[1]) / BAY;
    pos.push(a[0],y0,a[1], c[0],y1,c[1], b[0],y0,b[1],  a[0],y0,a[1], e[0],y1,e[1], c[0],y1,c[1]);
    uv.push(u,0, u+du,v1, u+du,0,  u,0, u,v1, u+du,v1);
    u += du;
  }
  if (cap) for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    pos.push(0,y1,0, pt[j][0],y1,pt[j][1], pt[i][0],y1,pt[i][1]);
    uv.push(0,0, 1,0, 0,1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

// 程序化玻璃帷幕貼圖：窗格 + 樓板腰帶 + 豎框
function glassTexture() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#3d5f5a'; x.fillRect(0, 0, s, s);
  const g = x.createLinearGradient(0, 0, 0, s * 0.82);
  g.addColorStop(0, '#2f5f58'); g.addColorStop(1, '#1f4540');
  x.fillStyle = g; x.fillRect(6, 0, s - 12, s * 0.82);      // 玻璃面
  x.fillStyle = '#8f9c97'; x.fillRect(0, s * 0.84, s, s * 0.16); x.fillStyle = '#2a3a37'; x.fillRect(0, s * 0.97, s, s * 0.03); // 樓板腰帶
  x.fillStyle = '#7d8b87'; x.fillRect(0, 0, 6, s);            // 豎框
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function buildTower() {

  // 裙樓：0–50m 斜向收分的石材基座

  const mall = new THREE.Mesh(new THREE.BoxGeometry(110, 22, 70), new THREE.MeshStandardMaterial({ color: 0x5f8a7f, roughness: 0.5, metalness: 0.3 }));
  mall.position.set(-75, 11, 35); mall.castShadow = mall.receiveShadow = true; tower.add(mall);
  const coinG = new THREE.CylinderGeometry(5, 5, 1.2, 32); // 大型古錢徽飾
  for (let k = 0; k < 4; k++) for (const sx of [-11, 11]) {
    const g = new THREE.Group(), c = new THREE.Mesh(coinG, metal); c.rotation.x = Math.PI / 2; c.castShadow = true;
    g.add(c); g.position.set(0, 56, 0); c.position.set(sx, 0, 27); g.rotation.y = k * Math.PI / 2; tower.add(g);
  }

  const rs = new THREE.Shape(); rs.moveTo(0, -3); rs.bezierCurveTo(-3, -2, -4, 1, -2, 2.2); rs.bezierCurveTo(-2.6, 3.6, -0.6, 4, 0, 2.8); rs.bezierCurveTo(0.6, 4, 2.6, 3.6, 2, 2.2); rs.bezierCurveTo(4, 1, 3, -2, 0, -3);
  const ruyiG = new THREE.ExtrudeGeometry(rs, { depth: 0.5, bevelEnabled: true, bevelSize: 0.15, bevelThickness: 0.15, bevelSegments: 2, curveSegments: 12 }); ruyiG.translate(0, 0, -0.25);

  const SEG_H = 40, BASE = 50;
  for (let i = 0; i < 8; i++) {
    const y0 = BASE + i * SEG_H, y1 = y0 + SEG_H;
    const hb = 26 - 0.5 * i, ht = hb + 3.2;
    tower.add(loft(poly(hb, 4), poly(ht, 4), y0, y1, i === 7 ? upper : glass));
    for (const [sx, sz] of [[1,1],[-1,1],[-1,-1],[1,-1]]) { // 節段角部小古錢
      const g = new THREE.Group(), c = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 0.8, 24), metal);
      c.rotation.x = Math.PI / 2; c.castShadow = true; g.add(c); g.position.set(sx * (ht - 2), y1 - 5, sz * (ht - 2)); g.rotation.y = Math.atan2(sx, sz); tower.add(g);
      const rg = new THREE.Group(), ru = new THREE.Mesh(ruyiG, metal); ru.scale.setScalar(0.6); ru.position.z = -0.6; ru.castShadow = true; // 如意雲紋
      rg.add(ru); rg.position.set(sx * (ht - 2), y1 - 12, sz * (ht - 2)); rg.rotation.y = Math.atan2(sx, sz); tower.add(rg);
    }
    tower.add(loft(poly(hb + 0.6, 4.4), poly(hb + 0.6, 4.4), y0, y0 + 1.6, band, false)); // 節間飾帶
    tower.add(loft(poly(ht + 0.5, 4.3), poly(ht + 0.5, 4.3), y1 - 1.2, y1, band, false)); // 節頂燈帶
    for (const [sx, sz] of [[1,1],[-1,1],[-1,-1],[1,-1]]) for (const sw of [0, 1]) { // 轉角切面邊緣燈線

      tower.add(strut(V(a[0], y0 + 1.6, a[1]), V(b[0], y1 - 1.2, b[1]), 0.12, edgeM)); }

  const top = BASE + 8 * SEG_H; // 370m

  // 頂冠：逐層內縮的階梯（含 89F 以上機房區）
  [[370, 384, 20, 18.5], [384, 400, 15, 13], [400, 420, 11.5, 10], [420, 449, 9.5, 8]].forEach(([a, b, h0, h1]) =>
    tower.add(loft(poly(h0, 3), poly(h1, 3), a, b, upper)));

  // 塔尖：449–508m
  const spire1 = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 3.2, 31, 16), metal);
  spire1.position.y = 449 + 15.5;
  const spire2 = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 1.0, 28, 12), metal);
  spire2.position.y = 480 + 14;
  spire1.castShadow = spire2.castShadow = true;
  tower.add(spire1, spire2);
  { const cp = new THREE.Mesh(new THREE.BoxGeometry(30, 0.6, 10), metal); cp.position.set(-75, 11, 76); cp.castShadow = true; tower.add(cp); // 入口雨庇
    for (const sx of [-14, 14]) tower.add(strut(V(-75 + sx, 22, 70.3), V(-75 + sx, 11, 81), 0.3, metal));
    for (let i = 0; i < 5; i++) { const x0 = -128 + i * 20; tower.add(strut(V(i % 2 ? x0 + 20 : x0, 0, 70.4), V(i % 2 ? x0 : x0 + 20, 22, 70.4), 0.25, metal)); } // 斜撐
    const rp = poly(15.4, 3.2), rm = new THREE.MeshStandardMaterial({ color: 0xc9ccd0, metalness: 1, roughness: 0.3 });

    for (let i = 0; i < 8; i++) { const a = rp[i], b = rp[(i + 1) % 8], len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.ceil(len / 1.4);
      for (const y of [393.4, 392.8]) tower.add(strut(V(a[0], y, a[1]), V(b[0], y, b[1]), 0.05, rm));
      for (let k = 0; k <= n; k++) { const f = k / n, x = a[0] + (b[0] - a[0]) * f, z = a[1] + (b[1] - a[1]) * f; tower.add(strut(V(x, 392.2, z), V(x, 393.4, z), 0.035, rm)); } }
  }

  const gold = new THREE.MeshStandardMaterial({ color: 0xd4a437, metalness: 1, roughness: 0.28 });
  const tmd = new THREE.Mesh(new THREE.SphereGeometry(2.75, 48, 32), gold); tmd.position.y = 372;
  tower.add(tmd);
  const steel = new THREE.MeshStandardMaterial({ color: 0x8a8f94, metalness: 1, roughness: 0.35 }), red = new THREE.MeshStandardMaterial({ color: 0xb3201a, roughness: 0.6 }), chrome = new THREE.MeshStandardMaterial({ color: 0xdadada, metalness: 1, roughness: 0.2 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 0.8, 32), steel); base.position.y = 367.6;
  const buf = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.55, 12, 40), red); buf.rotation.x = Math.PI / 2; buf.position.y = 368.4; // 紅色防撞緩衝環
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(5.5, 5.5, 1, 32), steel); plate.position.y = 390.5;
  tower.add(base, buf, plate); const links = [];
  for (let k = 0; k < 8; k++) { const mk = (r, m) => { const x = new THREE.Mesh(_c, m); x.userData.r = r; tower.add(x); return x; };

  tower.userData = { glass, upper, band, metal, granite, tmd, parts: { base, buf, plate }, links, mall, edgeM };
  return tower;
}

// 地面（暫為簡化街道格網，第二階段換成信義區街廓）
function buildGround() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#6b6b68'; x.fillRect(0, 0, s, s);
  x.fillStyle = '#7a7a76'; x.fillRect(24, 24, s - 48, s - 48);
    const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(86, 86); t.offset.set(0.5, 0.5);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(6020, 6020),
    new THREE.MeshStandardMaterial({ map: t, roughness: 0.95 }));
  m.rotation.x = -Math.PI / 2; m.receiveShadow = true;
  return m;
}

const $ = s => document.querySelector(s), clamp = THREE.MathUtils.clamp, V3 = (a) => new THREE.Vector3(...a);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0xb9c9d6, 0.0003);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 200000);
const HOME = [[330, 70, 560], [0, 235, 0]];
camera.position.set(...HOME[0]);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...HOME[1]); controls.enableDamping = true;
const lim = () => { controls.minDistance = 80; controls.maxDistance = 2000; controls.maxPolarAngle = Math.PI / 2 - 0.02; controls.enablePan = true; camera.near = 1; camera.updateProjectionMatrix(); };
lim();

// ---- 天空 / 星空 / 光線 ----
const sky = new Sky(); sky.scale.setScalar(100000); scene.add(sky);
const SU = sky.material.uniforms; Object.assign(SU.turbidity, { value: 6 }); SU.rayleigh.value = 1.3; SU.mieCoefficient.value = 0.005; SU.mieDirectionalG.value = 0.8;
const sp = []; for (let i = 0; i < 1800; i++) { const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) * 0.95 + 0.05; sp.push(v.normalize().multiplyScalar(60000)); }
const stars = new THREE.Points(new THREE.BufferGeometry().setFromPoints(sp), new THREE.PointsMaterial({ size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
scene.add(stars);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -350, right: 350, top: 350, bottom: -350, near: 100, far: 2500 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.6; scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x6f87b0, 0x20232b, 0); scene.add(hemi);
const flash = new THREE.PointLight(0xffffff, 0, 320, 0); scene.add(flash);
const pmrem = new THREE.PMREMGenerator(renderer), envScene = new THREE.Scene(); let envRT, lastElev = 99;
const ec = document.createElement('canvas'); ec.width = 1024; ec.height = 64; const ex = ec.getContext('2d'); ex.fillStyle = '#000'; ex.fillRect(0, 0, 1024, 64);
const eg = ex.createLinearGradient(0, 64, 0, 28); eg.addColorStop(0, 'rgba(255,170,90,.6)'); eg.addColorStop(1, 'rgba(0,0,0,0)'); ex.fillStyle = eg; ex.fillRect(0, 28, 1024, 36);
for (let i = 0; i < 900; i++) { ex.globalAlpha = 0.4 + Math.random() * 0.6; ex.fillStyle = Math.random() > 0.5 ? '#ffc98a' : '#cfe0ff'; ex.fillRect(Math.random() * 1024, 36 + Math.random() * 26, 2 + Math.random() * 3, 2); }
const envRing = new THREE.Mesh(new THREE.CylinderGeometry(5000, 5000, 800, 64, 1, true), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(ec), side: THREE.BackSide, fog: false, color: 0 })); envRing.position.y = 100; envScene.add(envRing); // 城市光影只存在於反射環境
function updateEnv(n = 0) { envRing.material.color.setScalar(n * 1.6); envScene.add(sky); envRT?.dispose(); envRT = pmrem.fromScene(envScene, 0, 1, 100000); scene.add(sky); scene.environment = envRT.texture; }

const radialTex = (r, g, b, a) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, `rgba(${r},${g},${b},${a})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); };
const mkMoon = (s, tex) => { const o = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, fog: false, depthWrite: false })); o.position.set(-18000, 22000, -30000); o.scale.setScalar(s); scene.add(o); return o; };
const moonH = mkMoon(6000, radialTex(255, 250, 235, 0.8)), moonC = mkMoon(1100, radialTex(255, 252, 240, 1));
// ---- 程序化雲層 + 夜間車燈光軌 ----
const cloudMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide, uniforms: { uCov: { value: 0 }, uDk: { value: 0 }, uT: { value: 0 }, uCol: { value: new THREE.Color(1, 1, 1) }, uCam: { value: new THREE.Vector3() } },

const clouds = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), cloudMat); clouds.rotation.x = -Math.PI / 2; clouds.position.y = 2200; clouds.frustumCulled = false; scene.add(clouds);
const CAR = 500, cars = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ fog: false }), CAR), cd = []; cars.frustumCulled = false; scene.add(cars);
for (let i = 0; i < CAR; i++) { const dir = Math.random() > 0.5 ? 1 : -1; cd.push({ ax: Math.random() > 0.5, c: (Math.floor(Math.random() * 41) - 20) * 70 + 35 + dir * 3.5, s: (Math.random() - 0.5) * 2800, v: dir * (12 + Math.random() * 14) }); cars.setColorAt(i, new THREE.Color(dir > 0 ? 0xff2a1a : 0xfff0c8)); }
const cmx = new THREE.Matrix4(), cq = new THREE.Quaternion();
function updCars(dt) { cars.visible = cars.material.color.r > 0.02; if (!cars.visible) return;
  cd.forEach((c, i) => { c.s += c.v * dt; if (Math.abs(c.s) > 1400) c.s *= -1; cmx.compose(c.ax ? V3([c.s, 0.5, c.c]) : V3([c.c, 0.5, c.s]), cq, c.ax ? V3([9, 0.35, 1.3]) : V3([1.3, 0.35, 9])); cars.setMatrixAt(i, cmx); }); cars.instanceMatrix.needsUpdate = true; }

// ---- 材質補丁：窗燈 shader + 塔身彎曲 ----
const ledCv = document.createElement('canvas'), ledTex = new THREE.CanvasTexture(ledCv); ledTex.minFilter = ledTex.magFilter = THREE.LinearFilter; ledTex.generateMipmaps = false;
const U = { uNight: { value: 0 }, uSway: { value: 0 }, uLed: { value: ledTex }, uLedW: { value: 10 }, uLedOn: { value: 0 }, uScroll: { value: 0 } };
function patch(m, win) {
  m.onBeforeCompile = s => {
    Object.assign(s.uniforms, U);
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nuniform float uSway;varying float vWY,vNy;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWY=position.y;vNy=normal.y;transformed.x += uSway * pow(max(position.y,0.)/450., 2.);');
    if (win) s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uNight,uLedW,uLedOn,uScroll;uniform sampler2D uLed;varying float vWY,vNy;\nfloat h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      vec2 id=floor(vMapUv), f=fract(vMapUv);
      float lit=step(.42,h21(id))*step(.18,h21(vec2(id.y,9.)))*step(.1,f.x)*step(f.y,.8)*step(.04,f.y);
      vec3 col=mix(vec3(1.,.72,.42),vec3(.75,.88,1.),step(.6,h21(id+7.)))*(.5+.8*h21(id+3.));
      float blind=.6+.4*step(.5,fract(f.y*9.));
      totalEmissiveRadiance+=col*lit*blind*uNight*2.2+vec3(.5,.45,.35)*.04*uNight*step(.1,f.x)*step(f.y,.8);
